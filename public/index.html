<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resumidor de Textos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container py-4">
    <h1 class="h3 mb-4">Resumidor de Textos</h1>

    <div class="row g-4">

      <aside class="col-12 col-lg-2 d-flex flex-column">
        <h2 class="h6 fw-semibold" id="tituloLongitud">Longitud</h2>
        <div class="d-flex flex-row flex-lg-column flex-wrap gap-2 mb-4" id="grupoLongitud" role="group" aria-labelledby="tituloLongitud">
          <button class="btn btn-opcion length-btn flex-fill" id="corto" aria-pressed="false">Corto</button>
          <button class="btn btn-opcion length-btn flex-fill" id="mediano" aria-pressed="false">Mediano</button>
          <button class="btn btn-opcion length-btn flex-fill" id="largo" aria-pressed="false">Largo</button>
        </div>
        <button class="btn btn-opcion mb-3" id="btnTema">Modo oscuro</button>
        <button class="btn btn-marca fw-semibold py-3 mt-lg-auto" id="btnResumir">Resumir</button>
      </aside>

      <section class="col-12 col-md-6 col-lg-5">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <h2 class="h4 mb-3">Original</h2>
            <textarea class="form-control border-0 shadow-none campo-texto flex-grow-1" id="textoOriginal" aria-label="Texto original" placeholder="Pega aquí tu texto..."></textarea>
          </div>
          <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
            <span class="small text-body-secondary" id="contadorOriginal">Palabras: 0</span>
          </div>
        </div>
      </section>

      <section class="col-12 col-md-6 col-lg-5">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <h2 class="h4 mb-3">Resumen</h2>
            <textarea class="form-control border-0 shadow-none campo-texto flex-grow-1" id="textoResumen" aria-label="Resumen" readonly placeholder="Aquí aparecerá el resumen..."></textarea>
          </div>
          <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
            <span class="small text-body-secondary" id="contadorResumen">Palabras: 0</span>
            <button class="btn btn-sm btn-opcion border-0 fs-5 py-0" id="btnCopiar" title="Copiar" aria-label="Copiar resumen">⧉</button>
          </div>
        </div>
      </section>

      <div class="col-12">
        <p class="estado" id="estado" role="status"></p>
      </div>

            <section class="col-12" aria-labelledby="tituloHistorial">
        <div class="card">
          <div class="card-body">

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
              <h2 class="h4 mb-0" id="tituloHistorial" tabindex="-1">Historial de resúmenes</h2>
              <button class="btn btn-sm btn-opcion" id="btnBorrarHistorial">Borrar historial</button>
            </div>

            <p class="text-body-secondary text-center py-4 mb-0" id="historialVacio">Todavía no hay resúmenes guardados.</p>
            <ul class="list-group list-group-flush" id="listaHistorial"></ul>

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 border-top pt-3 mt-2">
              <p class="small text-body-secondary mb-0">Este sitio guarda tu tema y tus últimos resúmenes solo en tu navegador, no en un servidor.</p>
              <button class="btn btn-sm btn-peligro" id="btnOlvidar">Olvidar mis datos</button>
            </div>

          </div>
        </div>
      </section>

    </div>
  </main>

  <p class="mensaje-copiado" id="mensajeCopiado" role="status">Texto copiado</p>

<script type="module" src="js/main.mjs"></script>
</body>
</html>
